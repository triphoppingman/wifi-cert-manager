services:
  web:
    build: .
    image: wifi-cert-manager:latest
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
      # cp config.example.yaml to config.yaml first, or remove this line to
      # rely solely on WCM_* environment variables / defaults.
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - WCM_DATA_DIR=/data
    restart: unless-stopped
